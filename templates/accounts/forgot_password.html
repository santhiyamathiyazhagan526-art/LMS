<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password | LMS</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eef6ff, #ffffff);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .reset-container {
            width: 100%;
            max-width: 430px;
        }

        .reset-card {
            background: #ffffff;
            border-radius: 18px;
            padding: 38px 35px;
            box-shadow: 0 12px 35px rgba(0, 70, 150, 0.12);
            border: 1px solid #e5eef9;
        }

        /* Lock Icon */
        .icon-wrapper {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #eaf3ff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .icon-wrapper svg {
            width: 34px;
            height: 34px;
            stroke: #1769e0;
            stroke-width: 2;
            fill: none;
        }

        /* Heading */
        .title {
            text-align: center;
            font-size: 27px;
            font-weight: 700;
            color: #172b4d;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #718096;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        /* Messages */
        .messages {
            margin-bottom: 18px;
        }

        .message {
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .message.error {
            background: #fff1f1;
            color: #c62828;
            border: 1px solid #ffd5d5;
        }

        .message.success {
            background: #edf9f0;
            color: #218838;
            border: 1px solid #ccebd3;
        }

        /* Form */
        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #344054;
            margin-bottom: 7px;
        }

        /* Input */
        .input-wrapper {
            position: relative;
        }

        .input-wrapper input {
            width: 100%;
            height: 48px;
            border: 1px solid #d7e1ee;
            border-radius: 9px;
            padding: 0 45px 0 14px;
            outline: none;
            font-size: 14px;
            color: #172b4d;
            background: #ffffff;
            transition: 0.2s ease;
        }

        .input-wrapper input::placeholder {
            color: #a0aec0;
        }

        .input-wrapper input:focus {
            border-color: #1769e0;
            box-shadow: 0 0 0 3px rgba(23, 105, 224, 0.10);
        }

        /* Password Eye Button */
        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            cursor: pointer;
            color: #718096;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toggle-password:hover {
            color: #1769e0;
        }

        .toggle-password svg {
            width: 20px;
            height: 20px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
        }

        /* Password Hint */
        .password-hint {
            font-size: 12px;
            color: #8a94a6;
            margin-top: 6px;
        }

        /* Reset Button */
        .reset-button {
            width: 100%;
            height: 49px;
            border: none;
            border-radius: 9px;
            background: #1769e0;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 5px;
            transition: 0.2s ease;
        }

        .reset-button:hover {
            background: #0f57c7;
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(23, 105, 224, 0.22);
        }

        .reset-button:active {
            transform: translateY(0);
        }

        /* Back to Login */
        .back-login {
            text-align: center;
            margin-top: 22px;
            font-size: 14px;
        }

        .back-login a {
            color: #1769e0;
            text-decoration: none;
            font-weight: 600;
        }

        .back-login a:hover {
            text-decoration: underline;
        }

        /* Mobile */
        @media (max-width: 480px) {

            body {
                padding: 15px;
            }

            .reset-card {
                padding: 30px 22px;
            }

            .title {
                font-size: 24px;
            }
        }
    </style>

</head>


<body>

    <div class="reset-container">

        <div class="reset-card">

            <!-- Lock Icon -->
            <div class="icon-wrapper">

                <svg viewBox="0 0 24 24">

                    <rect
                        x="4"
                        y="10"
                        width="16"
                        height="11"
                        rx="2">
                    </rect>

                    <path
                        d="M8 10V7a4 4 0 0 1 8 0v3">
                    </path>

                    <circle
                        cx="12"
                        cy="15.5"
                        r="1">
                    </circle>

                    <path
                        d="M12 16.5V18">
                    </path>

                </svg>

            </div>


            <!-- Title -->
            <h1 class="title">
                Reset Password
            </h1>

            <p class="subtitle">
                Enter your username and register number<br>
                to create a new password.
            </p>


            <!-- Django Messages -->
            {% if messages %}

                <div class="messages">

                    {% for message in messages %}

                        <div class="message
                            {% if message.tags == 'error' %}
                                error
                            {% elif message.tags == 'success' %}
                                success
                            {% endif %}
                        ">

                            {{ message }}

                        </div>

                    {% endfor %}

                </div>

            {% endif %}


            <!-- Reset Password Form -->
            <form method="POST">

                {% csrf_token %}


                <!-- Username -->
                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <div class="input-wrapper">

                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Enter your username"
                            required
                            autocomplete="username"
                        >

                    </div>

                </div>


                <!-- Register Number -->
                <div class="form-group">

                    <label for="register_no">
                        Register Number
                    </label>

                    <div class="input-wrapper">

                        <input
                            type="text"
                            id="register_no"
                            name="register_no"
                            placeholder="Enter your register number"
                            required
                        >

                    </div>

                </div>


                <!-- New Password -->
                <div class="form-group">

                    <label for="new_password">
                        New Password
                    </label>

                    <div class="input-wrapper">

                        <input
                            type="password"
                            id="new_password"
                            name="new_password"
                            placeholder="Enter new password"
                            minlength="8"
                            required
                            autocomplete="new-password"
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            onclick="togglePassword('new_password', this)"
                            aria-label="Show password"
                        >

                            <svg viewBox="0 0 24 24">

                                <path
                                    d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z">
                                </path>

                                <circle
                                    cx="12"
                                    cy="12"
                                    r="2.5">
                                </circle>

                            </svg>

                        </button>

                    </div>

                    <div class="password-hint">
                        Password must contain at least 8 characters.
                    </div>

                </div>


                <!-- Confirm Password -->
                <div class="form-group">

                    <label for="confirm_password">
                        Confirm Password
                    </label>

                    <div class="input-wrapper">

                        <input
                            type="password"
                            id="confirm_password"
                            name="confirm_password"
                            placeholder="Confirm new password"
                            minlength="8"
                            required
                            autocomplete="new-password"
                        >

                        <button
                            type="button"
                            class="toggle-password"
                            onclick="togglePassword('confirm_password', this)"
                            aria-label="Show password"
                        >

                            <svg viewBox="0 0 24 24">

                                <path
                                    d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z">
                                </path>

                                <circle
                                    cx="12"
                                    cy="12"
                                    r="2.5">
                                </circle>

                            </svg>

                        </button>

                    </div>

                </div>


                <!-- Reset Button -->
                <button
                    type="submit"
                    class="reset-button"
                >
                    Reset Password
                </button>

            </form>


            <!-- Back to Login -->
            <div class="back-login">

                <a href="{% url 'login' %}">
                    ← Back to Login
                </a>

            </div>

        </div>

    </div>


    <!-- JavaScript -->
    <script>

        function togglePassword(inputId, button) {

            const input =
                document.getElementById(inputId);

            if (input.type === "password") {

                input.type = "text";

                button.setAttribute(
                    "aria-label",
                    "Hide password"
                );

            } else {

                input.type = "password";

                button.setAttribute(
                    "aria-label",
                    "Show password"
                );
            }
        }

    </script>

</body>

</html>
