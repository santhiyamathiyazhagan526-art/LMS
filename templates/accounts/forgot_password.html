{% extends 'base.html' %}

{% block title %}
Forgot Password
{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card shadow p-4">

                <h3 class="text-center mb-4">
                    Forgot Password
                </h3>

                <form>

                    <div class="mb-3">

                        <label>Email Address</label>

                        <input
                            type="email"
                            class="form-control"
                            placeholder="Enter your email">

                    </div>

                    <button class="btn btn-primary w-100">

                        Send Reset Link

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
