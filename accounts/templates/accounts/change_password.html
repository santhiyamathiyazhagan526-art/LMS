<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#f4f6f9;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            width:420px;
            background:white;
            padding:35px;
            border-radius:10px;
            box-shadow:0 10px 30px rgba(0,0,0,.15);
        }

        h2{
            text-align:center;
            color:#4B0082;
            margin-bottom:25px;
        }

        label{
            font-weight:bold;
            display:block;
            margin-top:15px;
        }

        input{
            width:100%;
            padding:12px;
            margin-top:8px;
            border:1px solid #ccc;
            border-radius:6px;
        }

        button{
            width:100%;
            margin-top:25px;
            padding:12px;
            background:#6A0DAD;
            color:white;
            border:none;
            border-radius:6px;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#5b0ca0;
        }

        .message{
            color:red;
            text-align:center;
            margin-bottom:15px;
        }

        .success{
            color:green;
        }

    </style>

</head>

<body>

<div class="container">

    <h2>Change Password</h2>

    {% if messages %}
        {% for message in messages %}
            <p class="message {% if message.tags == 'success' %}success{% endif %}">
                {{ message }}
            </p>
        {% endfor %}
    {% endif %}

    <form method="POST">

        {% csrf_token %}

        <label>Current Password</label>
        <input type="password"
               name="current_password"
               required>

        <label>New Password</label>
        <input type="password"
               name="new_password"
               required>

        <label>Confirm Password</label>
        <input type="password"
               name="confirm_password"
               required>

        <button type="submit">
            Update Password
        </button>

    </form>

</div>

</body>
</html>
