{% extends 'base.html' %}

{% block title %}Delete Staff{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow border-0">

                <div class="card-header bg-danger text-white">

                    <h4 class="mb-0">
                        Delete Staff
                    </h4>

                </div>

                <div class="card-body text-center">

                    <h5>
                        Are you sure you want to delete this staff member?
                    </h5>

                    <h4 class="text-primary mt-3">
                        {{ object.name }}
                    </h4>

                    <p class="text-muted">
                        Staff ID : {{ object.staff_id }}
                    </p>

                    <form method="POST">

                        {% csrf_token %}

                        <a href="{% url 'staff_list' %}"
                           class="btn btn-secondary">

                            Cancel

                        </a>

                        <button type="submit"
                                class="btn btn-danger">

                            Delete

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
